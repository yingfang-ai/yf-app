name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # Acceptance bar (e2e/yf-acceptance.mjs): self-managed Next dev server on a
  # free loopback port, no credentials needed. S-E2E-25 additionally asserts
  # the sibling contract repo repos/yingfang is untouched, so both repos are
  # checked out side by side, mirroring the capsule layout the suite expects
  # (run cwd: repos/yf-app, sibling: ../yingfang). The legacy playwright job
  # was removed in step4 strip_coding_agent together with `npm run test:e2e`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: repos/yf-app
      - uses: actions/checkout@v4
        with:
          repository: yingfang-ai/yingfang
          path: repos/yingfang
          # The sibling contract repo is private: the default GITHUB_TOKEN is
          # scoped to this repo only and answers 404 for it. The
          # fine-grained read-only PAT in this secret (Contents: read-only on
          # yingfang-ai/yingfang) carries the cross-repo checkout.
          token: ${{ secrets.YINGFANG_CHECKOUT_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: repos/yf-app/package-lock.json
      - run: npm ci
        working-directory: repos/yf-app
      - run: npm run build
        working-directory: repos/yf-app
      - run: node e2e/yf-acceptance.mjs
        working-directory: repos/yf-app
      # Behavior bar (e2e/yf-behavior.mjs): in-test contract + LLM stubs, no
      # real yingfang or credentials; runs its own dev server (YF_DATA_DIR /
      # YF_API_UPSTREAM / YF_OPERATOR_USER_IDS test seams).
      - run: node e2e/yf-behavior.mjs
        working-directory: repos/yf-app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            repos/yf-app/test-results/e2e-yf/
            repos/yf-app/test-results/e2e-yf-behavior/
          retention-days: 7
