# Release publishes yf-app's own npm package via Trusted Publishing (OIDC),
# not a token secret: npm exchanges the short-lived GitHub OIDC token for a
# one-time publish credential, so no npm token secret exists to leak, expire,
# or trip 2FA. Triggered by pushing a v* tag (e.g. v0.0.21). The published
# identity is this repo's own package.json (name: yf-app) — yf-app is a
# permanent fork of silgrid/pi-web v0.0.20 and does not publish, follow, or
# merge from the upstream project.
#
# Prerequisite (one-time, npmjs.com console): the package `yf-app` has a
# Trusted Publisher configured for repository `yingfang-ai/yf-app` and
# workflow `release.yml`.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback (absorbed from upstream 2026-10-14): the tag-push
  # trigger has been dead on GitHub since 2026-10-03 — a pushed v* tag no
  # longer starts this workflow. Dispatch it manually after pushing the tag:
  #   gh workflow run release.yml --ref v<version>
  workflow_dispatch: {}

permissions:
  contents: read
  # npm Trusted Publishing: npm exchanges this OIDC token for a short-lived
  # publish credential. Do not remove.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No `registry-url` here on purpose: setup-node would write a
      # token-based .npmrc expecting NODE_AUTH_TOKEN, which no longer exists.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The files field in package.json ships the prebuilt .next output,
      # so the package published here is the built app, not the source tree.
      - run: npm run build
      # Trusted Publishing needs npm >= 11.5.1; node 22.19.0 bundles npm 10.9.
      - run: npm install -g npm@11
      - run: npm publish --access public --provenance
